<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeuroTide · 个人数据情绪地图</title>
    <!--
      注意：本文件是开发用的源模板（npm run dev 使用），不能直接双击运行。
      下面的守卫脚本用于自我纠错：若 700ms 后 React 仍未挂载，说明有人通过 file://
      双击打开了本文件（正常打开时 #root 早已有子节点，此提示永不显示、无闪烁），
      此时直接给出可点击的正确入口，避免出现无从判断的空白页。
    -->
    <script>
      setTimeout(function () {
        var root = document.getElementById('root')
        if (!root || root.hasChildNodes()) return
        root.innerHTML =
          '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;' +
          'background:#0f172a;color:#e2e8f0;padding:24px;box-sizing:border-box;' +
          'font-family:system-ui,-apple-system,Segoe UI,sans-serif">' +
          '<div style="max-width:580px">' +
          '<div style="font-size:20px;font-weight:600;color:#22d3ee;margin-bottom:12px">' +
          '你打开的是开发源文件，程序没有启动</div>' +
          '<div style="font-size:14px;line-height:1.9;color:#94a3b8">' +
          '本文件是 <code style="color:#e2e8f0">npm run dev</code> 用的模板，它引用的是 ' +
          'TypeScript 源码 <code style="color:#e2e8f0">/src/main.tsx</code>，' +
          '浏览器无法直接执行，所以在 file:// 下必然白屏。' +
          '</div>' +
          '<a href="./dist/index.html" style="display:inline-block;margin-top:20px;padding:12px 22px;' +
          'border-radius:8px;background:#22d3ee;color:#0f172a;font-weight:600;text-decoration:none">' +
          '点击打开真正的程序</a>' +
          '<div style="margin-top:18px;font-size:13px;line-height:1.9;color:#64748b">' +
          '正确的文件是 <code style="color:#94a3b8">dist/index.html</code>。<br>' +
          '若上面的链接打不开，说明还没构建过，双击项目根目录的 ' +
          '<a href="./open-neurotide.bat" style="color:#22d3ee">open-neurotide.bat</a> 即可。' +
          '</div></div></div>'
      }, 700)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
