name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / test / build / scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 代码规范（oxlint）
        run: npm run lint

      - name: 格式检查（Prettier）
        run: npm run format:check

      - name: 单元测试（Vitest）
        run: npm run test

      - name: 类型检查与构建（tsc + vite）
        run: npm run build

      - name: 入库前脱敏扫描
        run: npm run scan
